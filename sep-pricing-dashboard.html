:root{
  --navy-950:#061a2e;
  --navy-900:#0a2540;
  --navy-800:#0f3157;
  --navy-700:#153f6d;
  --blue-600:#1768c9;
  --blue-500:#2f8fe0;
  --blue-300:#8fcdf4;
  --blue-100:#e6f3fc;
  --bg:#f3f6fa;
  --surface:#ffffff;
  --border:#e2e8f1;
  --border-soft:#edf1f6;
  --ink-900:#0e2138;
  --ink-700:#2c405a;
  --ink-500:#647388;
  --ink-300:#9aa8ba;
  --positive:#1a8f5e;
  --positive-bg:#e8f7f0;
  --negative:#cf3f4a;
  --negative-bg:#fceaec;
  --amber:#b3791f;
  --amber-bg:#fbf1de;
  --yellow:#d69f1c;
  --yellow-bg:#fbf1de;
  --gauge-green:#1a8f5e;
  --gauge-yellow:#e0a72c;
  --gauge-red:#cf3f4a;
  --gauge-track:#e6eaf0;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(14,33,56,.04), 0 8px 24px -12px rgba(14,33,56,.12);
  --shadow-pop:0 12px 40px -8px rgba(10,37,64,.28);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Yekan','Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.7;
}
button,input,select,textarea{font-family:inherit;}
::selection{background:var(--blue-300);color:var(--navy-950);}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c7d3e0;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#aebccf;}

.app-shell{
  display:flex;
  min-height:100vh;
  width:100%;
}

/* ============ SIDEBAR ============ */
.sidebar{
  width:264px;
  flex:0 0 264px;
  background:linear-gradient(185deg,var(--navy-950) 0%,var(--navy-900) 55%,var(--navy-800) 100%);
  color:#dce8f5;
  display:flex;
  flex-direction:column;
  padding:22px 16px 18px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:14px 12px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.35);
}
.brand img{
  width:100%;
  max-width:170px;
  height:auto;
  display:block;
}
.brand-caption{
  font-size:10.5px;
  color:var(--ink-500);
  margin-top:2px;
  letter-spacing:.2px;
}
.project-title{
  margin:18px 4px 4px;
  font-size:13.5px;
  font-weight:700;
  color:#f2f7fc;
  line-height:1.85;
}
.project-sub{
  margin:0 4px 20px;
  font-size:11.5px;
  color:#93a8c2;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:10px;
  color:#b9c9de;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
  border:1px solid transparent;
  transition:background .15s ease, color .15s ease;
  user-select:none;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#eef4fb;}
.nav-item.active{
  background:rgba(47,143,224,.18);
  color:#fff;
  border-color:rgba(143,205,244,.35);
}
.nav-item.active svg{opacity:1;}

.sidebar-foot{
  margin-top:16px;
  padding:14px 14px;
  border-radius:var(--radius-md);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}
.sidebar-foot-label{font-size:10.5px;color:#93a8c2;margin-bottom:4px;}
.sidebar-foot-value{font-size:17px;font-weight:800;color:#fff;}
.sidebar-foot-value small{font-size:11px;font-weight:500;color:#93a8c2;margin-right:4px;}
.sidebar-foot-meta{font-size:10.5px;color:#7c93b0;margin-top:6px;}

/* ============ MAIN ============ */
.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(243,246,250,.92);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:20px 32px 16px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.topbar h1{
  font-size:21px;
  margin:0 0 4px;
  font-weight:800;
  color:var(--navy-900);
}
.topbar p{
  margin:0;
  font-size:12.5px;
  color:var(--ink-500);
}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.unit-toggle{
  display:flex;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:999px;
  padding:3px;
  gap:2px;
}
.unit-toggle button{
  border:none;
  background:transparent;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  color:var(--ink-500);
  cursor:pointer;
}
.unit-toggle button.active{
  background:var(--navy-900);
  color:#fff;
}
.btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-700);
  padding:8px 16px;
  border-radius:10px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:.15s;
}
.btn:hover{border-color:var(--blue-500);color:var(--blue-600);}
.btn-primary{
  background:var(--navy-900);
  border-color:var(--navy-900);
  color:#fff;
}
.btn-primary:hover{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
.btn-danger{color:var(--negative);}
.btn-danger:hover{border-color:var(--negative);color:var(--negative);}
.btn-sm{padding:6px 11px;font-size:11.5px;}

.page{
  padding:26px 32px 60px;
  max-width:1320px;
}

/* ============ GENERIC BLOCKS ============ */
.section-label{
  font-size:12px;
  font-weight:700;
  color:var(--blue-600);
  margin:30px 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-label:first-child{margin-top:0;}
.section-label .line{flex:1;height:1px;background:var(--border);}

.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:20px;
}
.card-pad-sm{padding:16px;}

.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:15px 16px;
  position:relative;
  overflow:hidden;
}
.stat::before{
  content:'';
  position:absolute;inset:0 auto 0 0;
  width:3px;
  background:var(--blue-500);
}
.stat.tone-positive::before{background:var(--positive);}
.stat.tone-negative::before{background:var(--negative);}
.stat.tone-navy::before{background:var(--navy-900);}
.stat.tone-amber::before{background:var(--amber);}
.stat-label{font-size:11.5px;color:var(--ink-500);margin-bottom:6px;font-weight:600;}
.stat-value{font-size:19px;font-weight:800;color:var(--ink-900);letter-spacing:-.2px;}
.stat-value small{font-size:11px;font-weight:600;color:var(--ink-500);margin-right:3px;}
.stat-sub{font-size:11px;color:var(--ink-300);margin-top:5px;}
.stat.tone-positive .stat-value{color:var(--positive);}
.stat.tone-negative .stat-value{color:var(--negative);}

.hero{
  background:linear-gradient(120deg,var(--navy-950) 0%,var(--navy-800) 60%,var(--blue-600) 130%);
  border-radius:22px;
  padding:32px 34px;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  box-shadow:var(--shadow-pop);
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;
  left:-60px;bottom:-90px;
  width:280px;height:280px;
  background:radial-gradient(circle,rgba(143,205,244,.28),transparent 70%);
}
.hero-label{font-size:12.5px;color:#a9c4e3;margin-bottom:8px;font-weight:600;}
.hero-value{font-size:44px;font-weight:800;letter-spacing:-1px;}
.hero-value small{font-size:15px;font-weight:600;color:#c9dcf0;margin-right:6px;}
.hero-note{font-size:12px;color:#a9c4e3;margin-top:10px;max-width:420px;}
.hero-side{display:flex;gap:26px;position:relative;z-index:1;flex-wrap:wrap;}
.hero-mini{min-width:110px;}
.hero-mini-label{font-size:10.5px;color:#a9c4e3;margin-bottom:4px;}
.hero-mini-value{font-size:17px;font-weight:700;color:#fff;}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  padding:4px 12px;border-radius:999px;
  font-size:11px;color:#eaf3fc;margin-bottom:14px;
}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#5be3a4;}

.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--ink-700);
  margin-bottom:6px;
}
.field .hint{font-size:10.5px;color:var(--ink-300);margin-top:5px;}
.input-wrap{position:relative;}
.field input[type=number],.field input[type=text],.field select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:13.5px;
  background:#fbfcfe;
  color:var(--ink-900);
  outline:none;
  transition:.15s;
  font-family:inherit;
}
.field input:focus,.field select:focus{
  border-color:var(--blue-500);
  background:#fff;
  box-shadow:0 0 0 3px rgba(47,143,224,.12);
}
.field input:disabled{background:#f0f2f5;color:var(--ink-300);}
.suffix{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-300);pointer-events:none;}
.field input.has-suffix{padding-left:44px;}

.locked-note{
  display:flex;align-items:center;gap:8px;
  background:var(--blue-100);
  border:1px solid #cfe6f9;
  color:var(--navy-800);
  border-radius:10px;
  padding:10px 12px;
  font-size:11.5px;
  margin-bottom:14px;
}
.locked-note svg{width:15px;height:15px;flex:0 0 15px;}

.range-row{display:flex;align-items:center;gap:10px;}
.range-row input[type=range]{flex:1;accent-color:var(--blue-600);}
.range-tag{
  min-width:52px;text-align:center;
  font-size:12px;font-weight:700;
  background:var(--blue-100);color:var(--navy-800);
  border-radius:8px;padding:4px 6px;
}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th,td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--border-soft);}
thead th{
  background:#f7f9fc;
  color:var(--ink-500);
  font-weight:700;
  font-size:11.3px;
  position:sticky;top:0;
}
tbody tr:hover{background:#f9fbfd;}
tbody tr.row-active{background:var(--blue-100);}
tbody tr.row-active td{font-weight:700;color:var(--navy-900);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;}
.table-wrap table{min-width:640px;}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.tag-positive{background:var(--positive-bg);color:var(--positive);}
.tag-negative{background:var(--negative-bg);color:var(--negative);}
.tag-neutral{background:#eef1f5;color:var(--ink-500);}

.bundle-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:900px){.bundle-list{grid-template-columns:repeat(2,1fr);}}
.bundle-card{
  border:1.5px solid var(--border);
  border-radius:var(--radius-md);
  padding:16px;
  cursor:pointer;
  transition:.15s;
  text-align:center;
  background:#fff;
  position:relative;
}
.bundle-card:hover{border-color:var(--blue-300);}
.bundle-card.selected{
  border-color:var(--blue-600);
  background:var(--blue-100);
  box-shadow:0 0 0 3px rgba(47,143,224,.12);
}
.bundle-qty{font-size:20px;font-weight:800;color:var(--navy-900);}
.bundle-unit{font-size:10.5px;color:var(--ink-500);margin-bottom:10px;}
.bundle-discount{font-size:13px;font-weight:700;color:var(--positive);}
.bundle-price{font-size:11.5px;color:var(--ink-500);margin-top:8px;}
.bundle-max{
  position:absolute;top:8px;left:8px;
  background:var(--amber-bg);color:var(--amber);
  font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;
}
.bundle-check{
  position:absolute;top:8px;right:8px;
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--border);
}
.bundle-card.selected .bundle-check{
  background:var(--blue-600);border-color:var(--blue-600);
}
.bundle-card.selected .bundle-check::after{
  content:'';display:block;width:100%;height:100%;
  background:#fff;clip-path:polygon(20% 50%,40% 68%,80% 24%,90% 34%,40% 88%,10% 60%);
}

.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

.override-box{
  border:1.5px dashed var(--border);
  border-radius:var(--radius-md);
  padding:16px;
  margin-top:6px;
}
.override-active{
  border-style:solid;
  border-color:var(--amber);
  background:var(--amber-bg);
}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:0 0 40px;}
.switch input{opacity:0;width:0;height:0;}
.switch span{position:absolute;inset:0;background:#d7dee7;border-radius:999px;transition:.2s;cursor:pointer;}
.switch span::before{content:'';position:absolute;width:16px;height:16px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + span{background:var(--blue-600);}
.switch input:checked + span::before{transform:translateX(-18px);}
.switch-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.switch-row .lbl{font-size:12.5px;font-weight:700;color:var(--ink-700);}

.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 4px;border-bottom:1px solid var(--border-soft);
  font-size:12px;
}
.history-item:last-child{border-bottom:none;}
.history-item .meta{color:var(--ink-500);font-size:10.5px;}

.empty-state{
  text-align:center;padding:34px 16px;color:var(--ink-300);font-size:12.5px;
}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}

.chart-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;}

/* ---- Gauge ---- */
.gauge-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:20px 20px 14px;
  text-align:center;
}
.gauge-card.lg{padding:26px 26px 18px;}
.gauge-top-label{font-size:12px;font-weight:700;color:var(--ink-500);margin-bottom:2px;}
.gauge-svg-wrap{display:flex;justify-content:center;}
.gauge-center-value{font-size:26px;font-weight:800;margin-top:2px;}
.gauge-card.lg .gauge-center-value{font-size:32px;}
.gauge-center-sub{font-size:11.5px;color:var(--ink-500);margin-top:2px;}
.gauge-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 13px;border-radius:999px;
  font-size:11.5px;font-weight:700;margin-top:10px;
}
.gauge-badge .dot{width:7px;height:7px;border-radius:50%;}
.gauge-badge.zone-green{background:var(--positive-bg);color:var(--gauge-green);}
.gauge-badge.zone-green .dot{background:var(--gauge-green);}
.gauge-badge.zone-yellow{background:var(--yellow-bg);color:var(--gauge-yellow);}
.gauge-badge.zone-yellow .dot{background:var(--gauge-yellow);}
.gauge-badge.zone-red{background:var(--negative-bg);color:var(--gauge-red);}
.gauge-badge.zone-red .dot{background:var(--gauge-red);}
.gauge-badge.zone-nodata{background:#eef1f5;color:var(--ink-300);}
.gauge-badge.zone-nodata .dot{background:var(--ink-300);}
.gauge-thresholds{
  display:flex;gap:10px;justify-content:center;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);
}
.gauge-thresholds .field{margin-bottom:0;flex:1;max-width:150px;}
.gauge-thresholds label{font-size:10.5px;}
.gauge-thresholds input{padding:7px 10px;font-size:12px;text-align:center;}
.gauge-note{font-size:11px;color:var(--ink-300);margin-top:10px;max-width:280px;margin-inline:auto;}

.disc-input{
  width:60px;padding:6px 4px;text-align:center;
  border:1px solid var(--border);border-radius:8px;
  font-size:13px;font-weight:700;color:var(--positive);
  background:#fbfcfe;font-family:inherit;
}
.disc-input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(47,143,224,.12);}
.disc-row{display:flex;align-items:center;justify-content:center;gap:5px;}

.compare-bars{display:flex;flex-direction:column;gap:16px;}
.compare-bar-row{display:flex;flex-direction:column;gap:6px;}
.compare-bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink-700);}
.compare-bar-track{height:14px;background:var(--gauge-track);border-radius:999px;overflow:hidden;}
.compare-bar-fill{height:100%;border-radius:999px;transition:width .25s;}

.scenario-form{display:flex;gap:10px;margin-bottom:16px;}
.scenario-form input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;}

.bundle-list-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}

footer.print-only{display:none;}

/* ============ MOBILE (phones incl. iPhone 13 / Safari) ============ */
@media (max-width: 880px){
  .app-shell{flex-direction:column;}
  .sidebar{
    width:100%;
    flex:0 0 auto;
    height:auto;
    position:static;
    flex-direction:row;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .brand{flex:0 0 auto;padding:8px 10px;}
  .brand img{max-width:84px;}
  .project-title,.project-sub{display:none;}
  .nav{
    flex-direction:row;
    flex:1;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  .nav-item{flex:0 0 auto;white-space:nowrap;padding:8px 12px;font-size:12px;}
  .nav-item svg{width:15px;height:15px;}
  .sidebar-foot{
    flex:0 0 auto;margin-top:0;padding:8px 12px;
    display:flex;flex-direction:column;align-items:flex-end;
    background:rgba(255,255,255,.05);
  }
  .sidebar-foot-label{margin-bottom:1px;}
  .sidebar-foot-value{font-size:14px;}
  .sidebar-foot-meta{display:none;}

  .topbar{padding:14px 16px 12px;}
  .topbar h1{font-size:17px;}
  .page{padding:16px 14px 48px;}

  .hero{padding:22px 18px;}
  .hero-value{font-size:30px;}
  .hero-side{gap:16px;}

  .two-col{gap:14px;}

  .gauge-card.lg{padding:18px 16px 14px;}
  .gauge-thresholds{flex-wrap:wrap;}
  .gauge-thresholds .field{max-width:none;flex:1 1 45%;}

  /* prevent iOS Safari auto-zoom-on-focus (inputs must be >=16px) */
  .field input,.field select,.scenario-form input,.disc-input{font-size:16px;}
}

@media (max-width: 640px){
  .bundle-list-tiers{grid-template-columns:1fr;}
}

@media print{
  .sidebar,.topbar-actions,.btn,.nav-item svg{}
  .sidebar{display:none;}
  .topbar{position:static;background:#fff;}
  .page{padding:0;max-width:100%;}
  body{background:#fff;}
  .card,.stat,.table-wrap,.hero{box-shadow:none;}
}

.badge-count{
  background:rgba(255,255,255,.14);
  border-radius:999px;
  padding:1px 8px;
  font-size:10px;
  margin-right:auto;
}
</style>
</head>

/* =========================================================
   PRICING ENGINE  (single source of truth)

   سقف تخفیف بسته‌ها = شکاف قیمتی سپ نسبت به بازار (قبل از اعمال
   تخفیف بسته، بر مبنای قیمت تعدیل‌شده ارزی) تا از حلقه محاسباتی
   جلوگیری شود. پله‌ها: ۵۰۰=یک‌چهارم سقف، ۱۵۰۰=نصف سقف، ۲۵۰۰=کل سقف.
========================================================= */
function getBundle(qty, ceilingPercent){
  const frac = (BUNDLE_TIER_FRACTION[qty] !== undefined) ? BUNDLE_TIER_FRACTION[qty] : 1;
  const hasCeiling = ceilingPercent !== null && ceilingPercent !== undefined;
  const discountPercent = hasCeiling ? ceilingPercent * frac : null;
  const discount = hasCeiling ? discountPercent / 100 : 0;
  return { quantity: qty, discount, discountPercent, tierFraction: frac };
}

function calculatePricing(state){
  const fxFactor = state.rialShare + state.fxShare * (state.currentFx / state.baseFx);
  const adjustedPrice = state.basePrice * fxFactor;

  const hasMarketRef = state.marketReferencePrice !== null && state.marketReferencePrice !== undefined && state.marketReferencePrice !== '' && Number(state.marketReferencePrice) > 0;
  // گپ راهبردی بر مبنای قیمت تعدیل‌شده ارزی (پیش از تخفیف بسته) محاسبه می‌شود
  const marketGap = hasMarketRef ? adjustedPrice - Number(state.marketReferencePrice) : null;
  const marketGapPercent = hasMarketRef ? (marketGap / Number(state.marketReferencePrice)) * 100 : null;
  const discountCeilingPercent = hasMarketRef ? Math.max(0, marketGapPercent) : null;

  const bundle = getBundle(state.selectedBundle, discountCeilingPercent);
  const bundlePrice = adjustedPrice * (1 - bundle.discount);
  const calculatedPrice = Math.max(bundlePrice, state.floorPrice);
  const brokerInputPrice = calculatedPrice;

  const rawSuggestedMarketPrice = brokerInputPrice * (1 - state.commercialAdjustment);
  const suggestedMarketPrice = Math.max(rawSuggestedMarketPrice, state.floorPrice);
  const hasOverride = state.managementOverridePrice !== null && state.managementOverridePrice !== undefined && state.managementOverridePrice !== '';
  const effectivePrice = hasOverride ? Number(state.managementOverridePrice) : calculatedPrice;
  return { fxFactor, adjustedPrice, bundlePrice, calculatedPrice, brokerInputPrice, marketGap, marketGapPercent, discountCeilingPercent, suggestedMarketPrice, effectivePrice, bundle, hasMarketRef };
}

function recalcDerivedCapacity(state){
  state.sepCapacity = Number(state.modelS80Capacity) + Number(state.modelS90Capacity);
  state.brokerCapacity = Math.round(state.sepCapacity * Number(state.participationRatio));
  state.totalNetworkCapacity = state.sepCapacity + state.brokerCapacity;
}

function brokerEconomics(state, fxOverride){
  const s = (fxOverride !== undefined) ? Object.assign({}, state, { currentFx: fxOverride }) : state;
  const calc = calculatePricing(s);
  const sellingPrice = (state.sellingPriceRef === 'reference' && calc.hasMarketRef) ? Number(state.marketReferencePrice) : calc.suggestedMarketPrice;
  const marginPerDevice = sellingPrice - calc.brokerInputPrice - Number(state.ancillaryCosts || 0);
  const deviceCount = state.brokerDeviceCount ? Number(state.brokerDeviceCount) : state.brokerCapacity;
  const totalMargin = marginPerDevice * deviceCount;
  const marginPercent = sellingPrice > 0 ? (marginPerDevice / sellingPrice) * 100 : 0;
  return Object.assign({}, calc, { sellingPrice, marginPerDevice, totalMargin, marginPercent, deviceCount });
}

function planEconomics(state){
  const deviceCount = state.economicsDeviceCount ? Number(state.economicsDeviceCount) : state.totalNetworkCapacity;
  const activeDevices = deviceCount * Number(state.activationRate);
  const annualTransactions = activeDevices * Number(state.transactionsPerDevice);
  const annualTransactionAmount = annualTransactions * Number(state.averageTransactionAmount);
  const be = brokerEconomics(state);
  const sepRevenue = state.totalNetworkCapacity * be.brokerInputPrice;
  const totalPlanValue = sepRevenue + be.totalMargin;
  return { deviceCount, activeDevices, annualTransactions, annualTransactionAmount, sepRevenue, brokerMargin: be.totalMargin, totalPlanValue, be };
}

function recalc(){
  recalcDerivedCapacity(pricingState);
  const out = calculatePricing(pricingState);
  Object.assign(pricingState, out);
  renderAll();
}

/* =========================================================
   FORMATTERS
========================================================= */
function unitConvert(n){
  return displayUnit === 'toman' ? n / 10 : n;
}
function unitLabel(){ return displayUnit === 'toman' ? 'تومان' : 'ریال'; }

function fmtMoney(n, opts){
  opts = opts || {};
  if(n === null || n === undefined || isNaN(n)) return '—';
  const val = opts.noConvert ? n : unitConvert(n);
  const rounded = Math.round(val);
  const str = rounded.toLocaleString('fa-IR');
  if(opts.bare) return str;
  return str + '<small> ' + unitLabel() + '</small>';
}
function fmtNum(n, digits){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('fa-IR', { maximumFractionDigits: digits===undefined?0:digits });
}
function fmtPercent(n, digits){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const d = digits === undefined ? 1 : digits;
  const sign = n > 0 ? '+' : '';
  return sign + Number(n).toLocaleString('fa-IR', { maximumFractionDigits: d, minimumFractionDigits: d }) + '٪';
}
function fmtDiscount(n){
  return Number(n*100).toLocaleString('fa-IR') + '٪';
}
function esc(s){

}
function nowStamp(){

    return new Intl.DateTimeFormat('fa-IR', { dateStyle:'medium', timeStyle:'short' }).format(new Date());
  }catch(e){ return new Date().toLocaleString(); }
}
function currentPersianMonthLabel(){

/* =========================================================
   GAUGE  (شکاف قیمتی سپ نسبت به بازار — پارامتر استراتژیک)
   منطق یک‌طرفه: فقط بالاتر بودن قیمت سپ از بازار ریسک محسوب می‌شود.
   gapPercent <= gaugeCautionThreshold  -> سبز
   gaugeCautionThreshold < gap <= gaugeDangerThreshold -> زرد
   gap > gaugeDangerThreshold -> قرمز
========================================================= */
function buildGauge(gapPercent, state, opts){
  opts = opts || {};
  const big = opts.size === 'lg';
  const width = big ? 340 : 272;
  const height = big ? 188 : 152;
  const cx = width/2, cy = height - 16;
  const r = width * 0.42;
  const strokeW = big ? 22 : 17;

  const caution = Number(state.gaugeCautionThreshold);
  const danger = Number(state.gaugeDangerThreshold);
  const min = Math.min(-20, caution - 15);
  const max = Math.max(30, danger + 15);

  function angleAt(v){
    const clamped = Math.min(max, Math.max(min, v));
    return 180 - 180 * (clamped - min) / (max - min);
  }
  function pt(theta, radius){
    const rad = theta * Math.PI / 180;
    return { x: cx + radius * Math.cos(rad), y: cy - radius * Math.sin(rad) };
  }
  function arcPath(vFrom, vTo, radius){
    const a1 = angleAt(vFrom), a2 = angleAt(vTo);
    const p1 = pt(a1, radius), p2 = pt(a2, radius);
    return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${radius} ${radius} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }

  const hasData = gapPercent !== null && gapPercent !== undefined;
  const greenPath = arcPath(min, Math.min(caution, max), r);
  const yellowPath = (danger > caution) ? arcPath(Math.max(caution, min), Math.min(danger, max), r) : '';
  const redPath = arcPath(Math.max(danger, min), max, r);

  const needleValue = hasData ? gapPercent : (min + max) / 2;
  const needleAngle = angleAt(needleValue);
  const needleTip = pt(needleAngle, r * 0.70);
  const needleBase1 = pt(needleAngle + 90, 5.5);
  const needleBase2 = pt(needleAngle - 90, 5.5);
  const needleColor = hasData ? 'var(--navy-900)' : 'var(--ink-300)';

  let zone = 'nodata';
  if(hasData){
    if(gapPercent <= caution) zone = 'green';
    else if(gapPercent <= danger) zone = 'yellow';
    else zone = 'red';
  }
  const zoneColorMap = { green:'#1a8f5e', yellow:'#c98a12', red:'#cf3f4a', nodata:'#9aa8ba' };
  const zoneLabelMap = {
    green:'ایمن — قیمت سپ هم‌راستا یا پایین‌تر از بازار',
    yellow:'احتیاط — نزدیک سقف مجاز ' + fmtPercent(danger,0),
    red:'ریسک — بیش از سقف مجاز ' + fmtPercent(danger,0),
    nodata:'برای فعال‌شدن، قیمت مرجع بازار را وارد کنید'
  };

  const svg = `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:${width}px;height:auto;">
      <path d="${greenPath}" fill="none" stroke="var(--gauge-green)" stroke-width="${strokeW}" opacity="${hasData?1:0.3}"/>
      ${yellowPath ? `<path d="${yellowPath}" fill="none" stroke="var(--gauge-yellow)" stroke-width="${strokeW}" opacity="${hasData?1:0.3}"/>` : ''}
      <path d="${redPath}" fill="none" stroke="var(--gauge-red)" stroke-width="${strokeW}" opacity="${hasData?1:0.3}"/>
      <line x1="${needleBase1.x.toFixed(2)}" y1="${needleBase1.y.toFixed(2)}" x2="${needleTip.x.toFixed(2)}" y2="${needleTip.y.toFixed(2)}" stroke="${needleColor}" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="${needleBase2.x.toFixed(2)}" y1="${needleBase2.y.toFixed(2)}" x2="${needleTip.x.toFixed(2)}" y2="${needleTip.y.toFixed(2)}" stroke="${needleColor}" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="6.5" fill="${needleColor}"/>
      <circle cx="${cx}" cy="${cy}" r="2.6" fill="#fff"/>
    </svg>
  `;

  const centerValue = hasData ? fmtPercent(gapPercent,1) : '—';

  return `
    <div class="gauge-svg-wrap">${svg}</div>
    <div class="gauge-center-value" style="color:${zoneColorMap[zone]}">${centerValue}</div>
    <div class="gauge-center-sub">شکاف قیمت سپ نسبت به قیمت مرجع بازار</div>
    <div class="gauge-badge zone-${zone}"><span class="dot"></span>${zoneLabelMap[zone]}</div>
  `;
}

function gaugeThresholdControls(state){
  return `
    <div class="gauge-thresholds">
      <div class="field">
        <label>سقف ایمن (٪)</label>
        <input type="number" value="${state.gaugeCautionThreshold}" oninput="onGaugeThreshold('gaugeCautionThreshold', this.value)">
      </div>
      <div class="field">
        <label>سقف مجاز (٪)</label>
        <input type="number" value="${state.gaugeDangerThreshold}" oninput="onGaugeThreshold('gaugeDangerThreshold', this.value)">

/* =========================================================
   COMPARISON BAR CHART (برای تصمیم‌گیری مدیرعامل درباره قیمت کارگزار)
========================================================= */
function buildCompareBars(s){
  const items = [
    { label:'قیمت محاسباتی سپ', value: s.calculatedPrice, color:'var(--navy-900)' },
    { label:'قیمت سپ به کارگزار', value: s.brokerInputPrice, color:'var(--blue-600)' },
    { label:'قیمت پیشنهادی بازار', value: s.suggestedMarketPrice, color:'var(--blue-300)' }
  ];
  if(s.hasMarketRef){
    items.push({ label:'قیمت مرجع بازار', value: Number(s.marketReferencePrice), color:'var(--amber)' });
  }
  const max = Math.max.apply(null, items.map(i => i.value).concat([1]));
  return `
    <div class="compare-bars">
      ${items.map(it => `
        <div class="compare-bar-row">
          <div class="compare-bar-label"><span>${it.label}</span><span>${fmtMoney(it.value)}</span></div>
          <div class="compare-bar-track"><div class="compare-bar-fill" style="width:${Math.max(4,(it.value/max)*100).toFixed(1)}%;background:${it.color};"></div></div>
        </div>
      `).join('')}
      ${!s.hasMarketRef ? '<div class="hint">با وارد کردن «قیمت مرجع بازار» در صفحه قیمت‌گذاری، مقایسه کامل می‌شود.</div>' : ''}
    </div>
  `;
}

/* =========================================================
   FIELD UPDATE HANDLERS
========================================================= */
function onNum(key, value){
  pricingState[key] = value === '' ? 0 : Number(value);
  recalc();
}
function onNumNullable(key, value){
  pricingState[key] = value === '' ? null : Number(value);
  recalc();
}
function onStr(key, value){
  pricingState[key] = value;
  recalc();
}
function onFxShareChange(value){
  const v = Math.min(1, Math.max(0, Number(value)));
  pricingState.fxShare = v;
  pricingState.rialShare = Math.round((1 - v) * 1000) / 1000;
  recalc();
}
function selectBundle(qty){
  pricingState.selectedBundle = qty;
  recalc();
}
function onGaugeThreshold(key, value){
  pricingState[key] = value === '' ? 0 : Number(value);
  recalc();
}
function toggleOverride(checked){
  if(checked){
    overrideDraft = pricingState.calculatedPrice ? String(Math.round(pricingState.calculatedPrice)) : '';
  } else {
    pricingState.managementOverridePrice = null;
    overrideDraft = '';
  }
  recalc();
}
function onOverrideDraft(v){ overrideDraft = v; }
function onOverrideReason(v){ pendingOverrideReason = v; }
function onOverrideUser(v){ pendingOverrideUser = v; }
function applyOverride(){
  if(overrideDraft === '' || isNaN(Number(overrideDraft))){ return; }
  const before = pricingState.calculatedPrice;
  pricingState.managementOverridePrice = Number(overrideDraft);
  recalc();
  overrideHistory.unshift({
    calculatedPrice: before,
    overridePrice: Number(overrideDraft),
    reason: pendingOverrideReason || '—',
    user: pendingOverrideUser || '—',
    timestamp: nowStamp()
  });
  pendingOverrideReason = '';
  pendingOverrideUser = '';
  persist();
  renderAll();
}
function clearOverride(){
  pricingState.managementOverridePrice = null;
  overrideDraft = '';
  recalc();
}

function lockMonth(){
  const label = currentPersianMonthLabel() || ('دوره #' + (monthlyLocks.length + 1));
  monthlyLocks.unshift({
    month: label,
    referenceFx: pricingState.currentFx,
    calculatedPrice: pricingState.calculatedPrice,
    approvedPrice: pricingState.effectivePrice,
    lockedAt: nowStamp()
  });
  persist();
  renderAll();
}
function removeLock(idx){
  monthlyLocks.splice(idx,1);
  persist();
  renderAll();
}

let scenarioNameDraft = '';
function onScenarioName(v){ scenarioNameDraft = v; }
function saveScenario(){
  const name = scenarioNameDraft.trim() || ('سناریو ' + (scenarios.length + 1));
  const snapshot = JSON.parse(JSON.stringify(pricingState));
  scenarios.unshift({
    id: Date.now(),
    name,
    savedAt: nowStamp(),
    snapshot
  });
  scenarioNameDraft = '';
  persist();
  renderAll();
}
function loadScenario(id){
  const sc = scenarios.find(s => s.id === id);
  if(!sc) return;
  pricingState = Object.assign({}, pricingState, sc.snapshot);
  recalc();
}
function deleteScenario(id){
  scenarios = scenarios.filter(s => s.id !== id);
  persist();
  renderAll();
}

  return `

        <div class="stat"><div class="stat-label">پله ۵۰۰ دستگاه = یک‌چهارم سقف</div><div class="stat-value">${hasCeiling?fmtPercent(ceiling*0.25,1):'—'}</div></div>
        <div class="stat"><div class="stat-label">پله ۱٬۵۰۰ دستگاه = نصف سقف</div><div class="stat-value">${hasCeiling?fmtPercent(ceiling*0.5,1):'—'}</div></div>
      </div>

    <div class="bundle-list-tiers">

    <div class="section-label">مقایسه بسته‌ها<div class="line"></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>تعداد بسته</th><th>سهم از سقف</th><th>درصد تخفیف (خودکار)</th><th>قیمت واحد پس از تخفیف</th><th>ارزش کل بسته</th><th></th></tr></thead>
        <tbody>
          ${BUNDLE_QUANTITIES.map(qty => {
            const b = getBundle(qty, ceiling);
            const price = s.adjustedPrice * (1 - b.discount);
            const total = price * b.quantity;

            return `

/* =========================================================
   PAGE: دامنه نوسان دلار (FX RANGE)
========================================================= */
function renderFx(){
  const s = pricingState;
  const amountChange = s.adjustedPrice - s.basePrice;
  const percentChange = (s.fxFactor - 1) * 100;
  const isIncrease = amountChange >= 0;

  const rows = FX_SENSITIVITY_RATES.map(fx => {
    const be = brokerEconomics(s, fx);
    return { fx, be };
  });
  const maxPrice = Math.max(...rows.map(r => r.be.calculatedPrice));
  const chartW = 900, chartH = 220, padL = 50, padB = 30, padT = 16, padR = 10;
  const plotW = chartW - padL - padR, plotH = chartH - padT - padB;
  const points = rows.map((r,i) => {
    const x = padL + (i/(rows.length-1)) * plotW;
    const y = padT + plotH - (r.be.calculatedPrice/maxPrice) * plotH;
    return {x,y,r};
  });
  const pathD = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${points[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  return `
    <div class="locked-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      قیمت سپ ماهیانه بر پایه تغییرات دامنه دلار قابل بازنگری است.
    </div>

    <div class="section-label">ورودی‌های نرخ ارز<div class="line"></div></div>
    <div class="card">
      <div class="grid grid-2">
        <div class="field">
          <label>نرخ ارز مبنا (D0)</label>
          <input type="number" value="${s.baseFx}" oninput="onNum('baseFx', this.value)">
          <div class="hint">نرخ مرجعی که قیمت پایه (P0) بر اساس آن تعیین شده</div>
        </div>
        <div class="field">
          <label>نرخ ارز جاری (D)</label>
          <input type="number" value="${s.currentFx}" oninput="onNum('currentFx', this.value)">
          <div class="hint">نرخ روز، برای محاسبه بازنگری ماهانه قیمت</div>
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <label>سهم ارزی از قیمت (fxShare) — سهم ریالی به‌صورت خودکار تکمیل می‌شود</label>
        <div class="range-row">
          <input type="range" min="0" max="1" step="0.01" value="${s.fxShare}" oninput="onFxShareChange(this.value)">
          <div class="range-tag">${fmtPercent(s.fxShare*100,0)}</div>
        </div>
        <div class="hint">سهم ریالی جاری: ${fmtPercent(s.rialShare*100,0)}</div>
      </div>
    </div>

    <div class="section-label">فرمول محاسبه بازنگری قیمت<div class="line"></div></div>
    <div class="card">
      <div class="stat-label" style="margin-bottom:10px;">۱) ضریب ارزی</div>
      <div dir="ltr" style="text-align:center;font-size:15px;font-weight:700;color:var(--navy-900);background:#f7f9fc;border-radius:10px;padding:12px;margin-bottom:6px;">
        fxFactor&nbsp;=&nbsp;rialShare&nbsp;+&nbsp;fxShare&nbsp;×&nbsp;(D&nbsp;÷&nbsp;D0)
      </div>
      <div class="hint" style="text-align:center;margin-bottom:16px;">ضریب ارزی = سهم ریالی + سهم ارزی × (نرخ ارز جاری ÷ نرخ ارز مبنا)</div>

      <div class="stat-label" style="margin-bottom:10px;">۲) قیمت تعدیل‌شده ارزی</div>
      <div dir="ltr" style="text-align:center;font-size:15px;font-weight:700;color:var(--navy-900);background:#f7f9fc;border-radius:10px;padding:12px;margin-bottom:6px;">
        adjustedPrice&nbsp;=&nbsp;P0&nbsp;×&nbsp;fxFactor
      </div>
      <div class="hint" style="text-align:center;margin-bottom:20px;">قیمت تعدیل‌شده = قیمت پایه × ضریب ارزی</div>

      <div class="grid grid-3">
        <div class="stat tone-navy"><div class="stat-label">ضریب ارزی جاری</div><div class="stat-value">${fmtNum(s.fxFactor,3)}</div></div>
        <div class="stat ${isIncrease?'tone-negative':'tone-positive'}"><div class="stat-label">مبلغ تغییر نسبت به قیمت پایه</div><div class="stat-value">${isIncrease?'+':''}${fmtMoney(amountChange)}</div></div>
        <div class="stat ${isIncrease?'tone-negative':'tone-positive'}"><div class="stat-label">درصد تغییر نسبت به قیمت پایه</div><div class="stat-value">${fmtPercent(percentChange,2)}</div></div>
      </div>

      <div class="gauge-note" style="margin-top:16px;max-width:none;text-align:center;">
        با ورود نرخ ارز جدید ${fmtNum(s.currentFx)} (نسبت به نرخ مبنا ${fmtNum(s.baseFx)})، قیمت پایه باید
        <b style="color:var(--navy-900);">${fmtMoney(Math.abs(amountChange))}</b>
        (معادل <b style="color:var(--navy-900);">${fmtNum(Math.abs(percentChange),2)}٪</b>)
        <b style="color:${isIncrease?'var(--gauge-red)':'var(--gauge-green)'};">${isIncrease?'افزایش':'کاهش'}</b> یابد تا به قیمت تعدیل‌شده ${fmtMoney(s.adjustedPrice)} برسد.
      </div>
    </div>

    <div class="chart-wrap" style="margin-top:22px;">
      <div class="stat-label" style="margin-bottom:12px;">روند قیمت تولیدی سپ نسبت به نرخ ارز</div>
      <svg viewBox="0 0 ${chartW} ${chartH}" style="width:100%;height:auto;overflow:visible;">
        <defs>
          <linearGradient id="fxArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2f8fe0" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#2f8fe0" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="${padL}" y1="${padT+plotH}" x2="${chartW-padR}" y2="${padT+plotH}" stroke="#e2e8f1" stroke-width="1"/>
        <path d="${areaD}" fill="url(#fxArea)"/>
        <path d="${pathD}" fill="none" stroke="#1768c9" stroke-width="2.5"/>
        ${points.map(p => `
          <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.fx===s.currentFx?5:3.5}" fill="${p.r.fx===s.currentFx?'#0a2540':'#1768c9'}" stroke="#fff" stroke-width="1.5"/>
        `).join('')}
        ${points.map(p => `
          <text x="${p.x.toFixed(1)}" y="${chartH-8}" font-size="10.5" fill="#647388" text-anchor="middle" font-family="Yekan">${fmtNum(p.r.fx)}</text>
        `).join('')}
      </svg>
    </div>

    <div class="section-label" style="margin-top:22px;">جدول حساسیت نرخ ارز<div class="line"></div></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>نرخ ارز</th>
            <th>قیمت تولیدی سپ</th>
            <th>قیمت سپ به کارگزار</th>
            <th>قیمت پیشنهادی بازار</th>
            <th>گپ مبلغی</th>
            <th>گپ درصدی</th>
            <th>اقتصاد کارگزار (کل)</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr class="${r.fx===s.currentFx?'row-active':''}">
              <td>${fmtNum(r.fx)} ${r.fx===s.currentFx?'<span class=\"tag tag-neutral\" style=\"margin-right:4px;\">جاری</span>':''}</td>
              <td>${fmtMoney(r.be.calculatedPrice)}</td>
              <td>${fmtMoney(r.be.brokerInputPrice)}</td>
              <td>${fmtMoney(r.be.suggestedMarketPrice)}</td>
              <td>${r.be.hasMarketRef?fmtMoney(r.be.marketGap):'—'}</td>
              <td><span class="tag ${!r.be.hasMarketRef?'tag-neutral':(r.be.marketGapPercent>0?'tag-negative':'tag-positive')}">${r.be.hasMarketRef?fmtPercent(r.be.marketGapPercent,1):'—'}</span></td>
              <td>${fmtMoney(r.be.totalMargin)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* =========================================================
   INTERNAL SELF-TESTS (console only — integrity check)
========================================================= */
(function runSelfTests(){
  const results = [];
  function assertClose(name, actual, expected, tol){
    tol = tol===undefined?0.01:tol;
    const ok = Math.abs(actual-expected) <= tol;
    results.push({name, ok, actual, expected});
  }

  // Test 1: FX factor = 1 when D = D0
  let t1 = calculatePricing({basePrice:1000000, baseFx:230000, currentFx:230000, fxShare:0.4, rialShare:0.6, selectedBundle:500, floorPrice:0, commercialAdjustment:0, marketReferencePrice:0, managementOverridePrice:null});
  assertClose('fxFactor=1 when D=D0', t1.fxFactor, 1);

  // Test 2: Participation ratio 1:1
  let cap = {modelS80Capacity:20000, modelS90Capacity:20000, participationRatio:1};
  recalcDerivedCapacity(cap);
  assertClose('sepCapacity=40000', cap.sepCapacity, 40000);
  assertClose('brokerCapacity=40000', cap.brokerCapacity, 40000);
  assertClose('totalNetworkCapacity=80000', cap.totalNetworkCapacity, 80000);

  // Test 3: price dependency on FX change
  let base = {basePrice:1000000, baseFx:230000, currentFx:230000, fxShare:0.4, rialShare:0.6, selectedBundle:500, floorPrice:0, commercialAdjustment:0, marketReferencePrice:0, managementOverridePrice:null};
  let p1 = calculatePricing(base);
  let p2 = calculatePricing(Object.assign({}, base, {currentFx:300000}));
  results.push({name:'SEP price changes with FX', ok: p1.calculatedPrice !== p2.calculatedPrice});
  results.push({name:'Broker input price changes with FX', ok: p1.brokerInputPrice !== p2.brokerInputPrice});

  // Test 4: floor price
  let p3 = calculatePricing(Object.assign({}, base, {currentFx:50000, floorPrice:900000}));
  results.push({name:'Price never below floor', ok: p3.calculatedPrice >= 900000 - 0.001});

  // Test 5: auto bundle discount derives from market gap ceiling (500=1/4, 1500=1/2, 2500=full)
  // adjustedPrice=1,000,000 (D=D0) ; marketReferencePrice=800,000 => gap=200,000 => ceiling=25%
  let gapBase = Object.assign({}, base, {marketReferencePrice:800000});
  let pT500 = calculatePricing(Object.assign({}, gapBase, {selectedBundle:500}));
  let pT1500 = calculatePricing(Object.assign({}, gapBase, {selectedBundle:1500}));
  let pT2500 = calculatePricing(Object.assign({}, gapBase, {selectedBundle:2500}));
  assertClose('Discount ceiling = market gap %', pT2500.discountCeilingPercent, 25);
  assertClose('Tier 500 = 1/4 of ceiling', pT500.bundle.discountPercent, 6.25);
  assertClose('Tier 1500 = 1/2 of ceiling', pT1500.bundle.discountPercent, 12.5);
  assertClose('Tier 2500 = full ceiling', pT2500.bundle.discountPercent, 25);

  // Test 6: override
  let p5 = calculatePricing(Object.assign({}, base, {managementOverridePrice:777777}));
  results.push({name:'Override: calculatedPrice unaffected', ok: p5.calculatedPrice === p1.calculatedPrice});
  assertClose('Override: effectivePrice uses override', p5.effectivePrice, 777777);

  // Test 7: market reference drives the auto bundle-discount ceiling (intentional, by design).
  // adjustedPrice must stay invariant to market reference; calculatedPrice at a discounted
  // tier is allowed to change because the discount ceiling itself is derived from the gap.
  let mrefBase = Object.assign({}, base, {selectedBundle:2500, floorPrice:200000});
  let p6a = calculatePricing(Object.assign({}, mrefBase, {marketReferencePrice:1000000}));
  let p6b = calculatePricing(Object.assign({}, mrefBase, {marketReferencePrice:500000}));
  assertClose('adjustedPrice stays invariant to market reference', p6a.adjustedPrice, p6b.adjustedPrice);
  results.push({name:'Bundle-tier calculatedPrice intentionally follows market gap', ok: p6a.calculatedPrice !== p6b.calculatedPrice});
  results.push({name:'Floor price still protects calculatedPrice', ok: p6b.calculatedPrice >= 200000 - 0.001});

  const failed = results.filter(r => !r.ok);
  console.log('%c[SEP Pricing Engine] Self-tests: ' + (results.length-failed.length) + '/' + results.length + ' passed', failed.length?'color:#cf3f4a':'color:#1a8f5e');
  if(failed.length){ console.warn('Failed tests:', failed); }
})();
